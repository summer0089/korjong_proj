services:
  app:
    container_name: korjong-app
    image: korjong-app:latest
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    expose:
      - "3000"
    volumes:
      - ../public/profile_images:/app/public/profile_images
    # หากต้องการเปิดเข้าถึง Next.js โดยตรงผ่านพอร์ต 3000 สามารถเอา comment ออกได้:
    # ports:
    #   - "3000:3000"
    networks:
      - korjong-network

  nginx:
    container_name: korjong-nginx
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - korjong-network

networks:
  korjong-network:
    driver: bridge
