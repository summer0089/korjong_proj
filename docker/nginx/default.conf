upstream nextjs_upstream {
    server app:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name websitename.com www.websitename.com localhost;

    # SSL Configuration (ใช้ไฟล์จาก docker/ssl)
    ssl_certificate /etc/nginx/ssl/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;

    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # หากต้องการบังคับ HTTP ไปเป็น HTTPS สามารถ uncomment 3 บรรทัดนี้ได้:
    # if ($scheme = http) {
    #     return 301 https://$host$request_uri;
    # }

    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # เมื่อผู้ใช้เข้า root / ให้ redirect ไปยัง /korjong ทันที (แก้ปัญหา 404 บน root)
    location = / {
        return 301 /korjong;
    }

    # แคชไฟล์ Static assets ของ Next.js ภายใต้ /korjong/_next/static/
    location /korjong/_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # เผื่อกรณีมีการเรียก /_next/ โดยตรงที่ root
    location /_next/ {
        proxy_pass http://nextjs_upstream/korjong/_next/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # รองรับกรณีมีการเรียกไฟล์รูปภาพ static ที่ root โดยตรง
    location ~* ^/(logo_korjong|signin_carousel|profile_images)/ {
        proxy_pass http://nextjs_upstream/korjong$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # รองรับการเรียก API ทั้งแบบ /korjong/api/... และแบบ /api/... จาก Client-side fetch
    location /api/ {
        proxy_pass http://nextjs_upstream/korjong/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Proxy ทุก Request ภายใต้ /korjong ไปยัง Next.js
    # (ใช้ /korjong แบบไม่มี slash ปิดท้าย เพื่อรองรับทั้ง /korjong และ /korjong/ และแก้ปัญหา Redirect Loop)
    location /korjong {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;

        # WebSockets support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Request headers
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Client IP and Protocol headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
